name: Deploy davidaruck.com to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: davidaruck-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
      CF_GLOBAL_KEY: ${{ secrets.CLOUDFLARE_GLOBAL }}
      CF_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
      CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
    steps:
      - name: Checkout davidruck repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Select available Cloudflare credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CF_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN=$CF_API_TOKEN" >> "$GITHUB_ENV"
            echo "Using CLOUDFLARE_API_TOKEN secret"
          elif [ -n "${CF_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN=$CF_TOKEN" >> "$GITHUB_ENV"
            echo "Using CLOUDFLARE_TOKEN secret"
          elif [ -n "${CF_GLOBAL_KEY:-}" ] && [ -n "${CF_EMAIL:-}" ]; then
            echo "CLOUDFLARE_API_KEY=$CF_GLOBAL_KEY" >> "$GITHUB_ENV"
            echo "CLOUDFLARE_EMAIL=$CF_EMAIL" >> "$GITHUB_ENV"
            echo "Using CLOUDFLARE_GLOBAL + CLOUDFLARE_EMAIL secrets"
          elif [ -n "${CF_GLOBAL_API_KEY:-}" ] && [ -n "${CF_EMAIL:-}" ]; then
            echo "CLOUDFLARE_API_KEY=$CF_GLOBAL_API_KEY" >> "$GITHUB_ENV"
            echo "CLOUDFLARE_EMAIL=$CF_EMAIL" >> "$GITHUB_ENV"
            echo "Using CLOUDFLARE_GLOBAL_API_KEY + CLOUDFLARE_EMAIL secrets"
          else
            echo "No usable Cloudflare credential is available to the davidruck repository." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Validate Worker
        run: |
          node --check src/index.js
          npx wrangler deploy --dry-run --outdir .wrangler/dry-run

      - name: Deploy davidaruck.com
        run: npx wrangler deploy --message "Deploy davidaruck.com from GitHub main"

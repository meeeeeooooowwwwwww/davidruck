name: Validate and deploy davidaruck.com

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: davidaruck-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit and validate site
        run: npm run check

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Detect Cloudflare deployment credential
        id: cloudflare-auth
        shell: bash
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Scoped Cloudflare API token detected."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No CLOUDFLARE_API_TOKEN is configured. Validation passed; production deploy is intentionally skipped."
          fi

      - name: Checkout repository
        if: steps.cloudflare-auth.outputs.available == 'true'
        uses: actions/checkout@v7

      - name: Set up Node.js
        if: steps.cloudflare-auth.outputs.available == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        if: steps.cloudflare-auth.outputs.available == 'true'
        run: npm ci

      - name: Deploy to Cloudflare
        if: steps.cloudflare-auth.outputs.available == 'true'
        run: npx wrangler deploy --message "Deploy davidaruck.com from GitHub main"

name: Validate and deploy davidaruck.com

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: davidaruck-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit and validate site
        run: npm run check

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify scoped Cloudflare credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is required for production deploys." >&2
            exit 1
          fi

      - name: Optimise large raster media for production
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jpegoptim pngquant >/dev/null

          while IFS= read -r -d '' file; do
            jpegoptim --strip-all --all-progressive --max=82 "$file"
          done < <(find public -type f \( -iname '*.jpg' -o -iname '*.jpeg' \) -size +500k -print0)

          while IFS= read -r -d '' file; do
            tmp="${file}.optimised.png"
            if pngquant --quality=65-82 --speed 1 --strip --output "$tmp" -- "$file"; then
              mv "$tmp" "$file"
            else
              rm -f "$tmp"
            fi
          done < <(find public -type f -iname '*.png' -size +500k -print0)

      - name: Deploy to Cloudflare
        run: npx wrangler deploy --message "Deploy davidaruck.com from GitHub main"

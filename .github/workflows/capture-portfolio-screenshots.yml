name: Capture authentic homepage portfolio screenshots

on:
  push:
    branches:
      - feat/portfolio-image-cards-20261030
    paths:
      - .github/workflows/capture-portfolio-screenshots.yml
      - scripts/capture-portfolio-screenshots.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot-six-public-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out portfolio branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser renderer
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture six public homepages
        run: node scripts/capture-portfolio-screenshots.mjs
      - name: Commit reviewed-source screenshot candidates to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/work-previews/*.jpg public/assets/work-previews/capture-metadata.json
          if ! git diff --cached --quiet; then
            git commit -m "assets: capture six real public homepage screenshots"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

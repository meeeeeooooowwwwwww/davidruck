name: Temporary source-media optimisation

on:
  push:
    branches:
      - professionalisation-20260921

permissions:
  contents: read

jobs:
  optimise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Install image optimisers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jpegoptim pngquant >/dev/null

      - name: Optimise PulzarFM source media
        shell: bash
        run: |
          set -euo pipefail
          jpegoptim --strip-all --all-progressive --max=82 public/media/pulzarfm/studio-party.jpg
          tmp="public/media/pulzarfm/dj-ruckus.optimised.png"
          pngquant --quality=65-82 --speed 1 --strip --output "$tmp" -- public/media/pulzarfm/dj-ruckus.png
          mv "$tmp" public/media/pulzarfm/dj-ruckus.png
          du -h public/media/pulzarfm/dj-ruckus.png public/media/pulzarfm/studio-party.jpg

      - name: Upload optimised media
        uses: actions/upload-artifact@v4
        with:
          name: optimised-pulzarfm-media
          path: |
            public/media/pulzarfm/dj-ruckus.png
            public/media/pulzarfm/studio-party.jpg
          if-no-files-found: error

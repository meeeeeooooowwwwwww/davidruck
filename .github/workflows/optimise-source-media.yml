name: Temporary source-media optimisation

on:
  push:
    branches:
      - professionalisation-20260921

permissions:
  contents: read

jobs:
  optimise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Install image optimisers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick pngquant >/dev/null

      - name: Optimise PulzarFM source media
        shell: bash
        run: |
          set -euo pipefail
          file public/media/pulzarfm/dj-ruckus.png public/media/pulzarfm/studio-party.jpg
          identify public/media/pulzarfm/dj-ruckus.png public/media/pulzarfm/studio-party.jpg

          jpg_tmp="public/media/pulzarfm/studio-party.optimised.jpg"
          convert public/media/pulzarfm/studio-party.jpg -auto-orient -strip -interlace Plane -quality 82 "$jpg_tmp"
          mv "$jpg_tmp" public/media/pulzarfm/studio-party.jpg

          png_tmp="public/media/pulzarfm/dj-ruckus.optimised.png"
          pngquant --quality=65-82 --speed 1 --strip --output "$png_tmp" -- public/media/pulzarfm/dj-ruckus.png
          mv "$png_tmp" public/media/pulzarfm/dj-ruckus.png

          file public/media/pulzarfm/dj-ruckus.png public/media/pulzarfm/studio-party.jpg
          du -h public/media/pulzarfm/dj-ruckus.png public/media/pulzarfm/studio-party.jpg

      - name: Upload optimised media
        uses: actions/upload-artifact@v4
        with:
          name: optimised-pulzarfm-media
          path: |
            public/media/pulzarfm/dj-ruckus.png
            public/media/pulzarfm/studio-party.jpg
          if-no-files-found: error

<script>
(async () => {
  const frame = document.getElementById('rumble-frame');
  const status = document.getElementById('rumble-status');

  try {
    const response = await fetch('/api/rumble/my-sister', { headers: { 'Accept': 'application/json' } });
    const data = await response.json();
    if (!response.ok || !data.ok || !data.src) throw new Error(data.error || 'Embed unavailable');

    const iframe = document.createElement('iframe');
    iframe.src = data.src;
    iframe.title = data.title || 'Selfie - The Chainsmokers';
    iframe.loading = 'eager';
    iframe.allow = 'autoplay; fullscreen; picture-in-picture; encrypted-media';
    iframe.allowFullscreen = true;
    iframe.referrerPolicy = 'strict-origin-when-cross-origin';
    frame.appendChild(iframe);
    status.hidden = true;
  } catch (error) {
    status.textContent = 'Video preview unavailable. Use “Watch on Rumble” below.';
  }
})();
</script>
